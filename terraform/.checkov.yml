# Checkov Skip Configuration
# Documents intentionally accepted findings with business justifications
#
# Usage: checkov -d . --framework terraform --config-file .checkov.yml

skip-check:
  # === ACR - Basic SKU Limitations ===
  # These features require Premium SKU ($$$). Intentionally using Basic for dev/portfolio.
  - CKV_AZURE_163  # Vulnerability scanning - handled by Defender for Containers instead
  - CKV_AZURE_237  # Dedicated data endpoints - Premium SKU only
  - CKV_AZURE_166  # Image quarantine - Premium SKU only
  - CKV_AZURE_167  # Retention policy - Premium SKU only
  - CKV_AZURE_233  # Zone redundancy - Premium SKU only
  - CKV_AZURE_165  # Geo-replication - Premium SKU only, single-region deployment
  - CKV_AZURE_139  # Private networking - Premium SKU + private endpoints required
  - CKV_AZURE_164  # Content trust/signed images - Premium SKU only

  # === AKS - Dev Environment Decisions ===
  - CKV_AZURE_115  # Private cluster - requires VPN/bastion, not needed for dev
  - CKV_AZURE_170  # Paid SLA SKU - free tier appropriate for dev/portfolio
  - CKV_AZURE_226  # Ephemeral OS disks - not supported on all VM SKUs
  - CKV_AZURE_227  # Host-based encryption - requires subscription feature flag
  - CKV_AZURE_117  # Disk encryption set - requires Key Vault + DES setup, planned for future
  - CKV_AZURE_232  # Dedicated system node pool - requires 2+ nodes, quota limited
  - CKV_AZURE_172  # Secrets Store CSI autorotation - CSI driver not yet enabled, planned for Key Vault phase
  - CKV_AZURE_168  # Min 50 pods - max_pods is 110, false positive from Checkov
