name: Azure Security Dashboard CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: securitydashboardcontainers2
  AKS_CLUSTER: sec-dashboard-aks
  AKS_RESOURCE_GROUP: security-dashboard
  IMAGE_NAME: security-dashboard
  TERRAFORM_DIR: terraform

jobs:
  # Security Scanning
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Checkov run
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ env.TERRAFORM_DIR }}
          framework: terraform
          config_file: ${{ env.TERRAFORM_DIR }}/.checkov.yml
          output_format: cli
          soft_fail: false

      # tfsec run
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: ${{ env.TERRAFORM_DIR }}
          soft_fail: false

      # Trivy file scan
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: 1

  # Build & Push Container Image
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Generate image metadata
        id: meta
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "version=${SHA}" >> $GITHUB_OUTPUT
          echo "Image tag: ${SHA}"

      - name: Build and push image
        run: |
          ACR_LOGIN=$(az acr show --name ${{ env.ACR_NAME }} --query loginServer -o tsv)
          docker build -t ${ACR_LOGIN}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} \
                       -t ${ACR_LOGIN}/${{ env.IMAGE_NAME }}:latest .
          docker push ${ACR_LOGIN}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          docker push ${ACR_LOGIN}/${{ env.IMAGE_NAME }}:latest

      # Trivy run

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Run Trivy image scan
        run: |
          ACR_LOGIN=$(az acr show --name ${{ env.ACR_NAME }} --query loginServer -o tsv)
          trivy image --severity CRITICAL --exit-code 1 ${ACR_LOGIN}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  # Terraform Infrastructure
  terraform:
    name: Terraform Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: ${{ env.TERRAFORM_DIR }}
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan -input=false -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}" -var="authorized_ip_ranges=[\"73.183.100.243/32\"]"

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

  # Deploy to AKS
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: [build, terraform]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install kubelogin
        run: |
          az aks install-cli
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AKS_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER }} \
            --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

      - name: Get ACR login server
        id: acr
        run: |
          ACR_LOGIN=$(az acr show --name ${{ env.ACR_NAME }} --query loginServer -o tsv)
          echo "login_server=${ACR_LOGIN}" >> $GITHUB_OUTPUT

      - name: Deploy to AKS
        run: |
          # Update image tag in deployment manifest
          sed -i "s|REPLACE_WITH_ACR_LOGIN_SERVER|${{ steps.acr.outputs.login_server }}|g" k8s/deployment.yaml
          sed -i "s|security-dashboard:v1|security-dashboard:${{ needs.build.outputs.image_tag }}|g" k8s/deployment.yaml

          # Apply manifests
          kubectl apply -f k8s/service-account.yaml
          kubectl apply -f k8s/deployment.yaml

          # Wait for rollout
          kubectl rollout status deployment/security-dashboard --timeout=120s

      - name: Verify deployment
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -l app=security-dashboard
          echo ""
          echo "=== Service ==="
          kubectl get service security-dashboard
          echo ""
          echo "=== Dashboard URL ==="
          EXTERNAL_IP=$(kubectl get service security-dashboard -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "Dashboard: http://${EXTERNAL_IP}"
