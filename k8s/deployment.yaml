apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-dashboard
  namespace: default
  labels:
    app: security-dashboard
spec:
  replicas: 1
    strategy:
    type: Recreate
  selector:
    matchLabels:
      app: security-dashboard
  template:
    metadata:
      labels:
        app: security-dashboard
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: sec-dashboard-sa
      containers:
        - name: security-dashboard
          image: REPLACE_WITH_ACR_LOGIN_SERVER/security-dashboard:v1
          ports:
            - containerPort: 8080
          env:
            - name: AZURE_SUBSCRIPTION_ID
              value: "a973e6b6-1cd1-4eb3-9ac9-7cf3110e2c6a"
            - name: LOG_ANALYTICS_WORKSPACE_ID
              value: "5116b00e-ec6f-4995-a6a6-22c5c1364d1c"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: security-dashboard
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: security-dashboard
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
